name: Build & Release (Testing)

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Flutter APK
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create env file
        run: echo "${{ secrets.chat_app }}" > .env

      - name: Flutter pub get
        run: flutter pub get

      - name: Bump versionCode
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          NAME=${VERSION%%+*}
          CODE=${VERSION##*+}
          NEW_CODE=$((CODE+1))
          sed -i '' "s/version: .*/version: $NAME+$NEW_CODE/" pubspec.yaml
          echo "Updated version to $NAME+$NEW_CODE"

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/app-release-$VERSION.apk

      - name: Install AWS CLI
        run: brew install awscli

      - name: Upload APK to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -e

          echo "Listing APK directory:"
          ls -lh build/app/outputs/flutter-apk

          APK_PATH=$(ls build/app/outputs/flutter-apk/*.apk)

          BUCKET=$(echo "${{ secrets.R2_BUCKET_NAME }}" | tr -d '\n')
          ACCOUNT=$(echo "${{ secrets.CF_ACCOUNT_ID }}" | tr -d '\n')

          echo "Uploading to bucket: $BUCKET"

          aws configure set default.s3.signature_version s3v4

          aws s3 cp \
            "$APK_PATH" \
            "s3://$BUCKET/" \
            --endpoint-url "https://$ACCOUNT.r2.cloudflarestorage.com"
          - name: Notify backends of new APK
          env:
          LOCAL_BACKEND_URL: ${{ secrets.LOCAL_BACKEND_URL }}
          PROD_BACKEND_URL: ${{ secrets.PROD_BACKEND_URL }}
          run: |
          set -e

          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          APK_FILE=$(ls build/app/outputs/flutter-apk/*.apk)
          APK_NAME=$(basename "$APK_FILE")

          BUCKET="${{ secrets.R2_BUCKET_NAME }}"
          ACCOUNT="${{ secrets.CF_ACCOUNT_ID }}"

          APK_URL="https://${ACCOUNT}.r2.cloudflarestorage.com/${BUCKET}/${APK_NAME}"

          echo "APK URL: $APK_URL"
          echo "Version: $VERSION"

          BODY=$(jq -n \
            --arg apk_url "$APK_URL" \
            --arg version "$VERSION" \
            '{apk_url: $apk_url, version: $version}')

          echo "Calling LOCAL backend (allowed to fail)"
          curl -X POST "$LOCAL_BACKEND_URL/api/app/add-new-version" \
            -H "Content-Type: application/json" \
            -d "$BODY" || echo "⚠️ Local backend failed (expected sometimes)"

          echo "Calling PROD backend (must succeed)"
          curl -X POST "$PROD_BACKEND_URL/api/app/add-new-version" \
            -H "Content-Type: application/json" \
            -d "$BODY"
