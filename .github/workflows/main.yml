name: Build & Release (Testing)

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Flutter APK
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create env file
        run: echo "${{ secrets.chat_app }}" > .env

      - name: Flutter pub get
        run: flutter pub get

      - name: Bump versionCode
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          NAME=${VERSION%%+*}
          CODE=${VERSION##*+}
          NEW_CODE=$((CODE+1))
          sed -i '' "s/version: .*/version: $NAME+$NEW_CODE/" pubspec.yaml
          echo "Updated version to $NAME+$NEW_CODE"

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/app-release-$VERSION.apk

      - name: Decode Firebase credentials
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 --decode > firebase.json

      - name: Install jq
        run: brew install jq

      # ✅ OFFICIAL GOOGLE STEP (this is the key)
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          export_default_credentials: true

      - name: Upload APK to Google Cloud Storage
        run: |
          PROJECT_ID=$(jq -r '.project_id' firebase.json)

          gsutil cp \
            build/app/outputs/flutter-apk/*.apk \
            gs://$PROJECT_ID.appspot.com/apks/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: build/app/outputs/flutter-apk/*.apk
