name: Build & Release (Testing)

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Flutter APK
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create env file
        run: echo "${{ secrets.chat_app }}" > .env

      - name: Flutter pub get
        run: flutter pub get

      - name: Bump versionCode
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          NAME=${VERSION%%+*}
          CODE=${VERSION##*+}
          NEW_CODE=$((CODE+1))
          sed -i '' "s/version: .*/version: $NAME+$NEW_CODE/" pubspec.yaml
          echo "Updated version to $NAME+$NEW_CODE"

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/app-release-$VERSION.apk

      - name: Install AWS CLI
        run: brew install awscli

      - name: Upload APK to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -e
          aws configure set default.s3.signature_version s3v4

          aws s3 cp \
            build/app/outputs/flutter-apk/*.apk \
            "s3://${{ secrets.R2_BUCKET_NAME }}/" \
            --endpoint-url "https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com"

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: build/app/outputs/flutter-apk/*.apk
